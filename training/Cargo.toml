[workspace]
resolver = "2"
members = ["poker_core", "trainer"]

[workspace.dependencies]
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
lto = "thin"

# Tests run optimized: the parity suites replay thousands of hands.
[profile.test]
opt-level = 3
