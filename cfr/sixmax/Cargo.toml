[package]
name = "sixmax"
version = "0.1.0"
edition = "2021"
description = "The 6-max CFR engine's command line: card groups, trees, training, evaluation, serving"

[[bin]]
name = "sixmax"
path = "src/main.rs"

[dependencies]
poker_core = { path = "../poker_core" }
sixmax_cfr = { path = "../sixmax_cfr" }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
